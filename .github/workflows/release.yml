name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Windows Binary
        run: |
          go build -ldflags="-s -w" -o discord-free-cloud.exe ./cmd/app

      - name: Setup Inno Setup
        uses: Minithra/innosetup-action@v1.2.2
        with:
          filepath: build/windows/installer.iss

      - name: Generate Checksums
        run: |
          CertUtil -hashfile discord-free-cloud.exe SHA256 > checksums.txt
          if (Test-Path "dist/DiscordFreeCloudSetup.exe") {
            CertUtil -hashfile dist/DiscordFreeCloudSetup.exe SHA256 >> checksums.txt
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            discord-free-cloud.exe
            dist/DiscordFreeCloudSetup.exe
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
